<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Fraunces';src:url('fonts/fraunces-wght.woff2') format('woff2');font-weight:100 900;}
@font-face{font-family:'Hanken Grotesk';src:url('fonts/hanken-wght.woff2') format('woff2');font-weight:100 900;}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/plexmono-400.woff2') format('woff2');font-weight:400;}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/plexmono-600.woff2') format('woff2');font-weight:600;}
:root{--paper:#FFF;--paper-2:#FAF8F4;--paper-edge:#E4DED2;--ink:#211B13;--ink-soft:#574B39;--ink-faint:#8A7A60;
 --rosa:#BC6076;--rosa-deep:#8C384E;--teal:#2C8A7B;--teal-deep:#1C5E54;
 --display:'Fraunces',Georgia,serif;--mono:'IBM Plex Mono',monospace;--body:'Hanken Grotesk',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1600px;height:900px;background:var(--paper);font-family:var(--body);color:var(--ink);
 padding:46px 60px 34px;display:flex;flex-direction:column}
.kicker{font-family:var(--mono);font-size:18px;letter-spacing:.22em;text-transform:uppercase;color:var(--rosa-deep);
 display:flex;align-items:center;gap:14px}
.kicker::before{content:"";width:46px;height:3px;background:var(--rosa);border-radius:2px}
h1{font-family:var(--display);font-size:48px;font-weight:600;letter-spacing:-.015em;margin:4px 0 16px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:14px 26px}
figure{display:flex;flex-direction:column;gap:8px;min-height:0}
.img{flex:1;border:1px solid var(--paper-edge);border-radius:5px;overflow:hidden;background:var(--paper-2);min-height:0}
.img img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
figcaption{display:flex;align-items:baseline;gap:12px}
.y{font-family:var(--display);font-size:38px;font-weight:600;line-height:1}
.t{font-family:var(--mono);font-size:16px;letter-spacing:.10em;text-transform:uppercase;color:var(--ink-faint)}
figure.on .y{color:var(--rosa-deep)} figure.on .img{border-color:var(--rosa);border-width:2px}
figure.off .y{color:var(--ink-faint)}
.src{font-family:var(--mono);font-size:15px;color:var(--ink-faint);margin-top:12px}
</style></head><body>
<div class="kicker">Champ de Mars · Paris</div>
<h1>Whole cities appear, then they are gone</h1>
<div class="grid">
  <figure class="on"><div class="img"><img src="assets/champ/panel-1867.png"></div>
    <figcaption><span class="y">1867</span><span class="t">exposition · 671 buildings</span></figcaption></figure>
  <figure class="off"><div class="img"><img src="assets/champ/panel-1868.png"></div>
    <figcaption><span class="y">1868</span><span class="t">one year later · all gone</span></figcaption></figure>
  <figure class="on"><div class="img"><img src="assets/champ/panel-1889.png"></div>
    <figcaption><span class="y">1889</span><span class="t">exposition · Eiffel Tower</span></figcaption></figure>
  <figure class="on"><div class="img"><img src="assets/champ/panel-1900.png"></div>
    <figcaption><span class="y">1900</span><span class="t">exposition · both banks</span></figcaption></figure>
</div>
<div class="src">Source: openhistoricalmap.org · mapped by jeffmeyer, Bookmark and 9 more</div>
</body></html>
