<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 230" role="img" aria-label="The map plane gains a time axis">
  <!-- plano del mapa (x · y) -->
  <g stroke="#574B39" stroke-width="1.2" fill="none" opacity=".85">
    <polygon points="90,185 230,140 390,185 250,230" fill="rgba(33,27,19,.05)"/>
    <line x1="137" y1="170" x2="297" y2="215"/>
    <line x1="183" y1="155" x2="343" y2="200"/>
    <line x1="143" y1="200" x2="283" y2="155"/>
    <line x1="196" y1="215" x2="336" y2="170"/>
  </g>
  <g font-family="IBM Plex Mono, ui-monospace, monospace">
    <text x="395" y="175" font-size="23" fill="#6E6250">x</text>
    <text x="60" y="185" font-size="23" fill="#6E6250">y</text>
    <text x="105" y="222" font-size="20" fill="#574B39" letter-spacing="2">WHERE</text>
  </g>
  <!-- eje del tiempo (t) -->
  <g stroke="#BC6076" stroke-width="2.5" fill="none">
    <line x1="240" y1="185" x2="240" y2="38"/>
    <path d="M232,48 L240,34 L248,48"/>
  </g>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20" fill="#D8A0AE">
    <g stroke="#BC6076" stroke-width="1.5">
      <line x1="234" y1="150" x2="246" y2="150"/>
      <line x1="234" y1="110" x2="246" y2="110"/>
      <line x1="234" y1="70" x2="246" y2="70"/>
    </g>
    <text x="254" y="154">1521</text>
    <text x="254" y="114">1808</text>
    <text x="254" y="74">2026</text>
  </g>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" fill="#BC6076">
    <text x="180" y="46" font-size="23" font-weight="600">t</text>
    <text x="152" y="64" font-size="20" letter-spacing="2">WHEN</text>
  </g>
</svg>
